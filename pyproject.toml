[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ormangozcu"
version = "0.1.0"
description = "Next-day forest-fire risk benchmark for Türkiye from FIRMS detections and ERA5 weather"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Muzammal Hussain"}]
dependencies = ["numpy>=1.24", "pandas>=1.5", "scikit-learn>=1.3", "matplotlib>=3.7"]

[tool.setuptools]
packages = ["ormangozcu"]

[tool.setuptools.package-data]
ormangozcu = ["turkiye_border.json"]
